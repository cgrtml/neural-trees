name: README benchmark table

# The README says its benchmark table is generated by benchmarks/run_benchmarks.py.
# This job re-runs the script (5 seeds, about four minutes on a laptop) and fails
# when a cell does not round to the README value (the script's TOLERANCE), so the
# claim cannot go stale silently again (#98). It runs when the models, the script
# or the README change, weekly, and on request.

on:
  push:
    branches: [main]
    paths:
      - "neural_trees/**"
      - "benchmarks/run_benchmarks.py"
      - "README.md"
      - ".github/workflows/benchmark-table.yml"
  pull_request:
    paths:
      - "neural_trees/**"
      - "benchmarks/run_benchmarks.py"
      - "README.md"
      - ".github/workflows/benchmark-table.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  table-matches-readme:
    name: Benchmark table matches README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Re-run the benchmark and compare with README.md
        run: python benchmarks/run_benchmarks.py --seeds 5 --check
