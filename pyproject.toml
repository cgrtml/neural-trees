[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-trees"
version = "0.6.1"
description = "Soft decision trees, mixture of experts, and statistical model comparison tests for Python. Scikit-learn compatible, PyTorch backend."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Cagri Temel", email = "cagritemel34@gmail.com" },
]
keywords = [
    "machine learning",
    "soft decision trees",
    "decision trees",
    "neural decision trees",
    "mixture of experts",
    "hierarchical mixture of experts",
    "omnivariate decision trees",
    "statistical tests",
    "5x2cv f test",
    "mcnemar test",
    "classifier comparison",
    "alpaydin",
    "sklearn",
    "scikit-learn",
    "pytorch",
    "differentiable trees",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "torch>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "matplotlib>=3.4",
    "jupyter",
    "nbclient>=0.7",
    "mypy>=1.8",
    "nbformat>=5.0",
    "plotly",
    "ruff>=0.4",
]

[project.urls]
"Live demo" = "https://neural-trees.streamlit.app"
Source = "https://github.com/cgrtml/neural-trees"
"Bug Tracker" = "https://github.com/cgrtml/neural-trees/issues"
Documentation = "https://github.com/cgrtml/neural-trees#readme"

[tool.setuptools.package-data]
neural_trees = ["py.typed"]

[tool.setuptools.packages.find]
include = ["neural_trees*"]
exclude = ["tests*", "notebooks*", "examples*", "benchmarks*"]

[tool.ruff]
target-version = "py39"
exclude = ["notebooks/"]

[tool.ruff.lint]
# Explicit rule selection (pinned alongside ruff==0.16.6 in CI): a future ruff
# release must not turn the build red on its own by widening the default set.
# These are exactly the rules verified clean below (I001/UP037/PLR0402/RUF022
# findings were applied with `ruff check --fix`).
select = ["E4", "E7", "E9", "F", "I001", "UP037", "PLR0402", "RUF022"]
# Ignore pre-existing patterns that are not part of this issue scope:
# - F401: unused imports in __init__.py are re-exports for the public API
# - FA100: `from __future__ import annotations` is a style preference, not a bug
# - BLE001: pre-existing blind exception catches in library code
# - C408: pre-existing dict() call style in app.py
# - S112, RUF059: pre-existing patterns
ignore = ["F401", "FA100", "BLE001", "C408", "S112", "RUF059"]

[tool.mypy]
files = ["neural_trees"]
ignore_missing_imports = true
# Signatures are checked, and the bodies of annotated functions with them. The
# bodies of unannotated internals are not: turning that on today reports noise
# from numpy and torch stubs rather than real defects, and a check nobody can
# keep green is a check people learn to ignore.
check_untyped_defs = false
